name: Ops runner

# Runs one organizer task from ops-runner/tasks/ on a GitHub-hosted runner.
# Only pushes to the claude/ops-runner branch start it; site publishing and
# tests keep their own triggers. The task to run is named in ops-runner/TASK.
on:
  push:
    branches: [claude/ops-runner]
  workflow_dispatch:

permissions:
  # Tasks may commit their results back to this branch only.
  contents: write

# Tasks that change production share one queue. Read-only tasks (screenshots,
# queries) put "[parallel]" in the commit message and run at once.
concurrency:
  group: ${{ contains(github.event.head_commit.message, '[parallel]') && format('ops-runner-{0}', github.sha) || 'ops-runner' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run task
        env:
          SUPABASE_PROJECT_REF: vdiemcofukuxglqsmlyz
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: bash ops-runner/run.sh
